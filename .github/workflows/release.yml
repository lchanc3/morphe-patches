name: Release

# Run manually from the Actions tab: pick a version, get a release Morphe
# Manager can consume as a patch source.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0"
        required: true
        default: "1.0.0"

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed to read the Morphe Gradle plugin from MorpheApp's package registry.
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew buildAndroid -Pversion="$VERSION" --no-daemon --console=plain

      - name: Update patches-bundle.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/patches-${VERSION}.mpp"
          jq --arg version "$VERSION" \
             --arg url "$DOWNLOAD_URL" \
             --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '.version = $version | .download_url = $url | .created_at = $created' \
             patches-bundle.json > patches-bundle.json.tmp
          mv patches-bundle.json.tmp patches-bundle.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git commit -m "chore: release v${VERSION} [skip ci]"
          git push

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" \
            "patches/build/libs/patches-${VERSION}.mpp" \
            --title "v${VERSION}" \
            --notes "JPTT patches v${VERSION}. Add as a patch source in Morphe Manager."
